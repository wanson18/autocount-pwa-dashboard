<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#ffffff" />
    <title>Price Check — Wanson Companies</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="preload" href="/fonts/NunitoSans-latin.woff2" as="font" type="font/woff2" crossorigin />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/theme.css" />
  </head>
  <body class="app">
    <!-- Wide screens: app bar with the page links. Phones use the back button below. -->
    <header class="app-bar desktop-only">
      <div class="app-bar-inner">
        <a class="brand" href="/" aria-label="Wanson Companies dashboard">
          <span class="brand-mark" aria-hidden="true">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 20v-8" />
              <path d="M12 20V5" />
              <path d="M19 20v-5" />
            </svg>
          </span>
          <span class="brand-name">Wanson Companies</span>
        </a>
        <nav class="app-nav" aria-label="Main">
          <a href="/">Dashboard</a>
          <a href="/today-invoices.html">Today's Invoices</a>
          <a href="/dispatch.html">Delivery Dispatch</a>
          <a href="/price-check.html" aria-current="page">Price Check</a>
        </nav>
      </div>
    </header>

    <main class="page">
      <div class="page-heading">
        <a
          href="/"
          class="back-btn mobile-only min-h-[44px] min-w-[44px]"
          aria-label="Back to Sales Dashboard"
        >
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M15 19l-7-7 7-7" />
          </svg>
        </a>
        <div class="min-w-0">
          <p class="eyebrow">Read-only check</p>
          <h1 class="page-title">Price Check</h1>
        </div>
        <div id="priceCheckOnline" class="page-note ml-auto">Fresh on demand</div>
      </div>

      <div class="pc-layout">
        <section class="panel panel-pad" aria-label="Price check controls">
          <label class="field-label" for="priceCheckRange">Monitored window</label>
          <div class="flex items-center gap-2">
            <!-- 16px text on the select stops iOS Safari zooming the page when it is tapped. -->
            <select id="priceCheckRange" class="field min-h-[44px] flex-1 min-w-0 text-base">
              <option value="today" selected>Today</option>
              <option value="seven_days">Last 7 days</option>
            </select>
            <button
              id="priceCheckRefresh"
              type="button"
              class="btn btn-primary min-h-[44px] shrink-0"
            >Refresh now</button>
          </div>
          <p id="priceCheckStatus" role="status" aria-live="polite" data-state="loading" class="status-banner mt-4 text-[15px]">Loading price check…</p>
          <div id="priceCheckCoverage" class="pc-sources mt-2" aria-live="polite"></div>
          <div class="pc-times">
            <span id="priceCheckScannedAt">Scanned: —</span>
            <span id="priceCheckWindow">Window: —</span>
          </div>
          <div id="priceCheckCounts" class="mt-4"></div>
        </section>

        <section id="priceCheckResultView">
          <div id="priceCheckList" class="space-y-3" aria-live="polite"></div>
        </section>
      </div>

      <p class="pc-footnote">
        Read-only alert only. It never blocks, approves, amends, or submits an invoice, and it keeps no alert history.
      </p>
    </main>

    <script>
      /* =========================================================================
         Price Check — protected, read-only, on-demand view.
         Every raw AutoCount string is passed through escapeHtml before it reaches
         innerHTML. Failed or unauthenticated refreshes clear prior customer rows.
         ========================================================================= */

      var activeRange = 'today';
      var requestSequence = 0;

      var HTML_ESCAPES = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };

      function $(id) {
        return document.getElementById(id);
      }

      function escapeHtml(value) {
        return String(value == null ? '' : value).replace(/[&<>"']/g, function (character) {
          return HTML_ESCAPES[character];
        });
      }

      function text(value, fallback) {
        return value == null || value === '' ? (fallback || '—') : String(value);
      }

      function formatTimestamp(value) {
        if (!value) return 'unknown';
        var date = new Date(value);
        return Number.isNaN(date.getTime()) ? String(value) : date.toLocaleString();
      }

      function windowLabel(settings) {
        if (!settings) return 'unknown';
        return escapeHtml(settings.monitorFrom) + ' → ' + escapeHtml(settings.through)
          + ' (history from ' + escapeHtml(settings.historyFrom) + ')';
      }

      function setStatus(state, message) {
        var element = $('priceCheckStatus');
        if (!element) return;
        element.textContent = message;
        element.dataset.state = state;
      }

      function showResult() {
        if ($('priceCheckResultView')) $('priceCheckResultView').hidden = false;
      }

      function clearResults() {
        if ($('priceCheckList')) $('priceCheckList').innerHTML = '';
        if ($('priceCheckCounts')) $('priceCheckCounts').innerHTML = '';
        if ($('priceCheckCoverage')) $('priceCheckCoverage').innerHTML = '';
        if ($('priceCheckScannedAt')) $('priceCheckScannedAt').textContent = '';
        if ($('priceCheckWindow')) $('priceCheckWindow').textContent = '';
      }

      var SOURCE_REASONS = {
        PRICE_SOURCE_UNAVAILABLE: 'AutoCount did not answer in time, or returned an error',
        PRICE_SOURCE_INVALID: 'AutoCount sent data in an unexpected format',
        PRICE_PROFILE_MISMATCH: 'AutoCount returned a different company than expected',
        PRICE_PAGE_INCOMPLETE: 'The invoice list was incomplete',
        PRICE_DUPLICATE_DOC: 'AutoCount listed the same invoice twice. This can happen when invoices change while the list is being read',
        PRICE_BOOK_MISMATCH: 'An invoice belonged to a different company book',
      };

      function sourceReason(code) {
        return Object.prototype.hasOwnProperty.call(SOURCE_REASONS, code)
          ? SOURCE_REASONS[code]
          : 'The scan could not be completed';
      }

      function isCount(value) {
        return typeof value === 'number' && Number.isFinite(value);
      }

      // Plain-language rendering of the numbers-only diagnostics from the API.
      function describeDetail(source) {
        var parts = [];
        if (isCount(source.attempts) && source.attempts > 1) parts.push('tried ' + source.attempts + ' times');
        if (source.strategy === 'windowed') parts.push('the last try read smaller date ranges');
        var detail = source.detail;
        if (detail && typeof detail === 'object') {
          if (detail.pageRepeated === true && isCount(detail.page)) {
            parts.push('page ' + detail.page + ' repeated the previous page');
          } else if (isCount(detail.windowIndex) && isCount(detail.windowCount)) {
            parts.push('problem in date range ' + detail.windowIndex + ' of ' + detail.windowCount
              + (isCount(detail.rowOnPage) ? ', row ' + detail.rowOnPage : ''));
          } else if (isCount(detail.page)) {
            parts.push('problem on page ' + detail.page + (isCount(detail.rowOnPage) ? ', row ' + detail.rowOnPage : ''));
          }
          if (isCount(detail.firstSeenOnPage)) parts.push('first seen on page ' + detail.firstSeenOnPage);
          if (isCount(detail.firstSeenInWindow)) parts.push('first seen in date range ' + detail.firstSeenInWindow);
          if (detail.sameContent === true) parts.push('the same invoice appeared twice');
          else if (detail.sameContent === false) parts.push('two different invoices share one ID');
          if (isCount(detail.receivedTotal) && isCount(detail.totalCount)) {
            parts.push('total changed from ' + detail.totalCount + ' to ' + detail.receivedTotal);
          } else if (isCount(detail.rowsRead) && isCount(detail.totalCount)) {
            parts.push(detail.rowsRead + ' of ' + detail.totalCount + ' invoices read'
              + (isCount(detail.windowCount) && !isCount(detail.windowIndex) ? ' in ' + detail.windowCount + ' date ranges' : ''));
          }
          if (isCount(detail.requestCount)) parts.push('stopped after ' + detail.requestCount + ' requests');
          if (isCount(detail.httpStatus)) parts.push('AutoCount replied HTTP ' + detail.httpStatus);
          if (detail.timedOut === true) parts.push('AutoCount took too long to answer');
        }
        return parts.join(' · ');
      }

      function buildSourceLine(source) {
        var name = escapeHtml(text(source && source.companyName, 'Unknown company'));
        var ok = Boolean(source && source.ok);
        var label = ok ? 'Verified' : 'Unavailable';
        var tone = ok ? 'c-pos' : 'c-neg';
        var html = '<div class="row-line py-2">'
          + '<div class="flex items-center justify-between gap-2">'
          + '<span class="min-w-0 break-words c-ink">' + name + '</span>'
          + '<span class="shrink-0 font-extrabold ' + tone + '">' + label + '</span>'
          + '</div>';
        if (!ok) {
          var code = source && source.code ? ' <span class="c-muted">(' + escapeHtml(source.code) + ')</span>' : '';
          html += '<div class="c-neg text-[13px]">' + escapeHtml(sourceReason(source && source.code)) + code + '</div>';
          var details = describeDetail(source || {});
          if (details) html += '<div class="c-muted text-[13px]">Details: ' + escapeHtml(details) + '</div>';
        } else if (source && source.strategy === 'windowed') {
          html += '<div class="c-muted text-[13px]">AutoCount\'s invoice list was inconsistent when read page by page, so it was read again in smaller date ranges and re-checked.</div>';
        } else if (source && isCount(source.attempts) && source.attempts > 1) {
          html += '<div class="c-muted text-[13px]">The first read was inconsistent, so it was repeated once.</div>';
        }
        return html + '</div>';
      }

      function buildCounts(counts, alerts) {
        var data = counts || {};
        var price = Number.isFinite(Number(data.priceChanges))
          ? Number(data.priceChanges)
          : alerts.filter(function (alert) { return alert.type === 'PRICE_CHANGED'; }).length;
        var uom = Number.isFinite(Number(data.uomChanges))
          ? Number(data.uomChanges)
          : alerts.filter(function (alert) { return alert.type === 'UOM_CHANGED'; }).length;
        var noHistory = Number(data.noHistory) || 0;
        // These three describe invoices inside the monitored window only.
        var notApproved = Number(data.skippedUnapproved) || 0;
        var cancelled = Number(data.skippedVoid) || 0;
        var unreadable = (Number(data.skippedInvalidLine) || 0) + (Number(data.skippedInvalidInvoice) || 0);
        var cells = [
          ['Price changes', price, ' is-rose'],
          ['UOM changes', uom, ' is-butter'],
          ['No history', noHistory, ''],
          ['Not approved yet', notApproved, ''],
        ];
        return '<div class="count-grid">' + cells.map(function (cell) {
          return '<div class="count-cell' + cell[2] + '">'
            + '<div class="count-label">' + cell[0] + '</div>'
            + '<div class="count-value">' + cell[1] + '</div>'
            + '</div>';
        }).join('') + '</div>'
          + '<p class="mt-3 text-[13px] c-muted">Cancelled: ' + cancelled
          + ' · Unreadable rows: ' + unreadable
          + '. Invoices not approved yet are only checked after approval.</p>';
      }

      function shortCompany(name) {
        var value = text(name, 'Unknown company');
        if (/sdn/i.test(value)) return 'Sdn Bhd';
        if (/^wanson enterprise$/i.test(value.trim())) return 'Enterprise';
        return value;
      }

      function isDecrease(value) {
        return String(value == null ? '' : value).charAt(0) === '-';
      }

      function signed(value) {
        var textValue = String(value == null ? '' : value);
        if (!textValue) return '';
        return textValue.charAt(0) === '-' ? textValue : '+' + textValue;
      }

      function percentValue(alert) {
        var value = parseFloat(alert.differencePercent);
        return Number.isFinite(value) ? Math.abs(value) : 0;
      }

      // Newest invoices first; within a day, price changes before UOM changes,
      // then the biggest percentage move first.
      function sortAlerts(alerts) {
        return alerts.slice().sort(function (a, b) {
          var dateA = String(a.docDate || '');
          var dateB = String(b.docDate || '');
          if (dateA !== dateB) return dateA < dateB ? 1 : -1;
          var typeA = a.type === 'UOM_CHANGED' ? 1 : 0;
          var typeB = b.type === 'UOM_CHANGED' ? 1 : 0;
          if (typeA !== typeB) return typeA - typeB;
          var moveA = percentValue(a);
          var moveB = percentValue(b);
          if (moveA !== moveB) return moveB - moveA;
          var docA = String(a.docNo || '');
          var docB = String(b.docNo || '');
          if (docA !== docB) return docA < docB ? 1 : -1;
          return String(a.itemCode || '') < String(b.itemCode || '') ? -1 : 1;
        });
      }

      // One-line "what changed", shown on the collapsed card.
      function buildChangeSummary(alert) {
        if (alert.type === 'UOM_CHANGED') {
          return 'UOM ' + escapeHtml(text(alert.previousUom, '?')) + ' → ' + escapeHtml(text(alert.uom, '?'));
        }
        var decrease = isDecrease(alert.differenceMYR);
        var move = (decrease ? '▼' : '▲')
          + '<span class="sr-only">' + (decrease ? ' decrease ' : ' increase ') + '</span> '
          + escapeHtml(signed(text(alert.differenceMYR, '')) || '—');
        if (alert.differencePercent != null && alert.differencePercent !== '') {
          move += ' (' + escapeHtml(signed(alert.differencePercent)) + '%)';
        }
        return 'RM ' + escapeHtml(text(alert.previousPrice, '—')) + ' → RM ' + escapeHtml(text(alert.currentPrice, '—'))
          + ' · ' + move;
      }

      function buildAlertCard(alert) {
        var isUom = alert.type === 'UOM_CHANGED';
        var delta = isUom
          ? 'UOM ' + escapeHtml(text(alert.previousUom, '?')) + ' → ' + escapeHtml(text(alert.uom, '?'))
          : 'RM ' + escapeHtml(text(alert.differenceMYR, '—'))
            + (alert.differencePercent != null && alert.differencePercent !== ''
              ? ' (' + escapeHtml(alert.differencePercent) + '%)'
              : '');
        return '<article class="panel alert-card" data-alert-card>'
          + '<button type="button" data-alert-toggle aria-expanded="false" class="alert-head min-h-[44px]">'
          + '<span class="alert-id">'
          + '<span class="alert-item">' + escapeHtml(text(alert.itemCode, 'Unknown item')) + '</span>'
          + '<span class="alert-who">'
          + '<span class="min-w-0 break-words">' + escapeHtml(text(alert.customerName, 'Unknown customer')) + '</span>'
          + '<span class="shrink-0">· ' + escapeHtml(text(alert.docNo, '—')) + '</span>'
          + '</span>'
          + '</span>'
          + '<span class="pill alert-pill ' + (isUom ? 'pill-butter' : 'pill-rose') + '">'
          + (isUom ? 'UOM CHANGED' : 'PRICE CHANGED') + '</span>'
          + '<span class="alert-move">' + buildChangeSummary(alert) + '</span>'
          + '<span class="alert-meta">' + escapeHtml(shortCompany(alert.companyName)) + ' · ' + escapeHtml(text(alert.docDate, '—')) + '</span>'
          + '<svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 9l-7 7-7-7"></path></svg>'
          + '</button>'
          + '<div data-alert-detail class="alert-detail hidden">'
          + '<div>Company: ' + escapeHtml(text(alert.companyName, 'Unknown company')) + '</div>'
          + '<div>Invoice: ' + escapeHtml(text(alert.docNo, '—')) + ' · ' + escapeHtml(text(alert.docDate, '—')) + '</div>'
          + '<div>Customer: ' + escapeHtml(text(alert.customerCode, '—')) + ' · ' + escapeHtml(text(alert.customerName, '—')) + '</div>'
          + '<div>Item: ' + escapeHtml(text(alert.itemCode, '—')) + ' · ' + escapeHtml(text(alert.description, '—')) + '</div>'
          + '<div>UOM: ' + escapeHtml(text(alert.uom, '—')) + (isUom ? ' (was ' + escapeHtml(text(alert.previousUom, '?')) + ')' : '') + '</div>'
          + '<div>Current: RM ' + escapeHtml(text(alert.currentPrice, '—')) + ' / ' + escapeHtml(text(alert.uom, '?'))
          + ' · Previous: RM ' + escapeHtml(text(alert.previousPrice, '—')) + ' / ' + escapeHtml(text(alert.previousUom, '?')) + '</div>'
          + '<div>Delta: ' + delta + '</div>'
          + '<div>Reference: ' + escapeHtml(text(alert.previousDocNo, '—')) + ' · ' + escapeHtml(text(alert.previousDocDate, '—')) + '</div>'
          + '</div></article>';
      }

      function renderCoverage(sources) {
        var list = Array.isArray(sources) ? sources : [];
        if (!list.length) return '<span class="c-muted">No source coverage reported.</span>';
        return list.map(buildSourceLine).join('');
      }

      function isEnvelope(data) {
        if (!data || typeof data !== 'object' || Array.isArray(data)) return false;
        if (!Array.isArray(data.sources) || !Array.isArray(data.alerts)) return false;
        if (data.status !== 'PASS' && data.status !== 'PARTIAL' && data.status !== 'FAIL') return false;
        if (data.sources.length !== 2) return false;
        var okCount = data.sources.filter(function (source) { return source && source.ok === true; }).length;
        if (data.status === 'PASS' && okCount !== 2) return false;
        if (data.status === 'PARTIAL' && okCount !== 1) return false;
        if (data.status === 'FAIL') {
          if (okCount !== 0) return false;
          if (data.alerts.length > 0) return false;
        }
        return true;
      }

      function isAcceptableResponse(httpStatus, data) {
        if (!isEnvelope(data)) return false;
        if (data.status === 'FAIL') return httpStatus === 502;
        return httpStatus >= 200 && httpStatus < 300;
      }

      function renderInvalidResult() {
        clearResults();
        setStatus('error', 'ERROR · Price check returned an unrecognized result — no cached prices are shown');
        showResult();
      }

      function renderResult(data) {
        if (!isEnvelope(data)) {
          renderInvalidResult();
          return;
        }
        var alerts = Array.isArray(data.alerts) ? data.alerts : [];
        var sources = Array.isArray(data.sources) ? data.sources : [];
        var failedSources = sources.filter(function (source) { return source && source.ok === false; });
        var failed = failedSources.length;
        var statusText;
        if (data.status === 'FAIL') {
          statusText = 'FAIL · No book produced a complete verified scan — tap Refresh now to try again. If it keeps failing, tell the admin and show them the details below.';
        } else if (data.status === 'PARTIAL') {
          statusText = 'PARTIAL · ' + failedSources.map(function (source) {
            return text(source.companyName, 'Unknown company');
          }).join(' and ') + ' could not be checked — results are incomplete and must not be read as zero differences';
        } else if (alerts.length === 0) {
          statusText = 'PASS · Complete coverage · No price differences found';
        } else {
          statusText = 'PASS · Complete coverage · ' + alerts.length + ' difference' + (alerts.length === 1 ? '' : 's');
        }
        var state = data.status === 'FAIL' ? 'fail' : data.status === 'PARTIAL' ? 'partial' : (alerts.length ? 'alert' : 'ok');
        setStatus(state, statusText);

        if ($('priceCheckCoverage')) $('priceCheckCoverage').innerHTML = renderCoverage(sources);
        if ($('priceCheckScannedAt')) $('priceCheckScannedAt').textContent = 'Scanned: ' + formatTimestamp(data.scannedAt);
        if ($('priceCheckWindow')) $('priceCheckWindow').textContent = 'Window: ' + windowLabel(data.window);
        if ($('priceCheckCounts')) $('priceCheckCounts').innerHTML = buildCounts(data.counts, alerts);
        if ($('priceCheckList')) {
          if (alerts.length) {
            $('priceCheckList').innerHTML = sortAlerts(alerts).map(buildAlertCard).join('');
          } else if (data.status === 'PASS') {
            $('priceCheckList').innerHTML = '<div class="panel panel-pad text-sm c-ink">No price differences in the monitored window.</div>';
          } else {
            $('priceCheckList').innerHTML = '';
          }
        }
        showResult();
      }

      function renderNetworkError() {
        clearResults();
        var online = typeof navigator === 'undefined' || navigator.onLine !== false;
        if (online) {
          setStatus('unavailable', 'UNAVAILABLE · Price check could not be reached — no cached prices are shown. Check your connection, then tap Refresh now.');
        } else {
          setStatus('offline', 'OFFLINE · You are offline — price check is unavailable and no cached prices are shown');
        }
        showResult();
      }

      function renderUnauthorized() {
        clearResults();
        setStatus('unauthorized', 'UNAUTHORIZED · Sign in on the dashboard first');
        if ($('priceCheckList')) {
          $('priceCheckList').innerHTML = '<div class="panel panel-pad text-sm c-ink">Sign in at the top of the dashboard, then return here. <a href="/" class="c-link font-bold underline">Back to dashboard</a></div>';
        }
        showResult();
      }

      var FAILURE_HINTS = {
        408: 'The scan took too long. Tap Refresh now to retry; Today is faster than Last 7 days.',
        429: 'Too many requests. Wait a minute, then tap Refresh now.',
        503: 'Price check is temporarily unavailable. Try again shortly.',
        504: 'The scan took too long. Tap Refresh now to retry; Today is faster than Last 7 days.',
      };

      function renderFailure(httpStatus) {
        clearResults();
        var code = Number(httpStatus || 0);
        var hint = FAILURE_HINTS[code] || 'Tap Refresh now to try again.';
        setStatus('fail', 'FAIL · Price check could not be completed (HTTP ' + code + ') — ' + hint);
        showResult();
      }

      function setLoading(loading) {
        var refresh = $('priceCheckRefresh');
        if (!refresh) return;
        refresh.disabled = Boolean(loading);
        refresh.classList.toggle('animate-pulse', Boolean(loading));
      }

      async function loadPrices(range) {
        activeRange = range || activeRange;
        var requestId = ++requestSequence;
        setLoading(true);
        clearResults();
        setStatus('loading', 'LOADING · Refreshing price check…');
        try {
          var response = await fetch('/api/price-check?range=' + encodeURIComponent(activeRange), {
            cache: 'no-store',
            credentials: 'same-origin',
            headers: { Accept: 'application/json' },
          });
          if (requestId !== requestSequence) return;
          if (response.status === 401) {
            renderUnauthorized();
            return;
          }
          var data = await response.json().catch(function () { return null; });
          if (requestId !== requestSequence) return;
          if (isAcceptableResponse(response.status, data)) {
            renderResult(data);
            return;
          }
          if (!response.ok) {
            renderFailure(response.status);
            return;
          }
          renderInvalidResult();
        } catch (error) {
          if (requestId !== requestSequence) return;
          renderNetworkError();
        } finally {
          if (requestId === requestSequence) setLoading(false);
        }
      }

      function toggleAlert(toggle) {
        var card = toggle.closest ? toggle.closest('[data-alert-card]') : null;
        if (!card) return;
        var detail = card.querySelector('[data-alert-detail]');
        if (!detail) return;
        var expanded = !detail.classList.toggle('hidden');
        toggle.setAttribute('aria-expanded', String(expanded));
        var chevron = toggle.querySelector ? toggle.querySelector('.chev') : null;
        if (chevron && chevron.classList) chevron.classList.toggle('rotate-180', expanded);
      }

      function bindEvents() {
        var refresh = $('priceCheckRefresh');
        if (refresh) refresh.addEventListener('click', function () { loadPrices(activeRange); });
        var range = $('priceCheckRange');
        if (range) range.addEventListener('change', function () { loadPrices(range.value); });
        var list = $('priceCheckList');
        if (list) list.addEventListener('click', function (event) {
          var toggle = event.target && event.target.closest ? event.target.closest('[data-alert-toggle]') : null;
          if (toggle) toggleAlert(toggle);
        });
      }

      function init() {
        bindEvents();
        loadPrices(activeRange);
      }

      window.addEventListener('load', init);
    </script>
  </body>
</html>
