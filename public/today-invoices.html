<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#ffffff" />
    <title>Today's Invoices — Wanson Companies</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="preload" href="/fonts/NunitoSans-latin.woff2" as="font" type="font/woff2" crossorigin />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/theme.css" />
  </head>
  <body class="app">
    <!-- Wide screens: app bar with the page links. Phones use the back button below. -->
    <header class="app-bar desktop-only">
      <div class="app-bar-inner">
        <a class="brand" href="/" aria-label="Wanson Companies dashboard">
          <span class="brand-mark" aria-hidden="true">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 20v-8" />
              <path d="M12 20V5" />
              <path d="M19 20v-5" />
            </svg>
          </span>
          <span class="brand-name">Wanson Companies</span>
        </a>
        <nav class="app-nav" aria-label="Main">
          <a href="/">Dashboard</a>
          <a href="/today-invoices.html" aria-current="page">Today's Invoices</a>
          <a href="/dispatch.html">Delivery Dispatch</a>
          <a href="/price-check.html">Price Check</a>
        </nav>
      </div>
    </header>

    <main class="page">
      <div class="inv-top">
        <div class="page-heading">
          <a href="/" aria-label="Back to dashboard" class="back-btn mobile-only">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M15 19l-7-7 7-7" />
            </svg>
          </a>
          <div class="min-w-0">
            <p class="eyebrow">Wanson Companies</p>
            <h1 class="page-title">Today's Invoices</h1>
          </div>
        </div>

        <!-- ===== Status tabs ===== -->
        <div class="inv-tabs" role="group" aria-label="Payment status">
          <button type="button" id="tabAll" class="tab-btn" data-status="all" aria-pressed="false">All</button>
          <button type="button" id="tabPaid" class="tab-btn" data-status="paid" aria-pressed="false">Paid</button>
          <button type="button" id="tabPartial" class="tab-btn" data-status="partial" aria-pressed="false">Partial</button>
          <button type="button" id="tabUnpaid" class="tab-btn" data-status="unpaid" aria-pressed="false">Unpaid</button>
        </div>
      </div>

      <div class="inv-info">
        <div id="summaryLine" class="inv-summary">Loading…</div>
        <div id="coverageLine" class="coverage" aria-live="polite">Loading both company books…</div>
      </div>

      <div class="panel overflow-hidden">
        <div id="invoiceHead" class="inv-head hidden" aria-hidden="true">
          <span>Customer</span>
          <span>Company</span>
          <span>Invoice</span>
          <span>Status</span>
          <span>Total</span>
        </div>
        <div id="listSkeleton" class="p-4 space-y-2">
          <div class="skeleton h-4 rounded w-full"></div>
          <div class="skeleton h-4 rounded w-3/4"></div>
          <div class="skeleton h-4 rounded w-5/6"></div>
        </div>
        <div id="invoiceList" class="hidden"></div>
      </div>
    </main>

    <script>
      const $ = (id) => document.getElementById(id);

      const PAYMENT_STATUS_META = {
        paid: { label: 'Paid', badgeClass: 'pill pill-mint' },
        partial: { label: 'Partial', badgeClass: 'pill pill-butter' },
        unpaid: { label: 'Unpaid', badgeClass: 'pill pill-rose' },
        unknown: { label: 'Unknown', badgeClass: 'pill pill-mist' },
      };

      const TAB_IDS = { all: 'tabAll', paid: 'tabPaid', partial: 'tabPartial', unpaid: 'tabUnpaid' };

      const HTML_ESCAPES = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
      function escapeHtml(str) {
        return String(str ?? '').replace(/[&<>"']/g, (c) => HTML_ESCAPES[c]);
      }

      function formatMYR(value) {
        return `RM ${Number(value || 0).toLocaleString('en-MY', { minimumFractionDigits: 2 })}`;
      }

      function formatNumber(value) {
        return Number(value || 0).toLocaleString();
      }

      function renderCoverage(data) {
        const companies = Array.isArray(data?.companies) ? data.companies : [];
        if (companies.length === 0) {
          $('coverageLine').className = 'coverage is-error';
          $('coverageLine').textContent = data?.error || 'Both company books are unavailable';
          return;
        }

        const allUnavailable = companies.every((company) => company.status !== 'ok');
        $('coverageLine').className = `coverage${data.complete ? '' : ' is-bad'}`;
        const label = data.complete
          ? 'Both books loaded'
          : allUnavailable
            ? 'NO DATA — both books unavailable'
            : 'PARTIAL DATA — check the unavailable book';
        const details = companies
          .map((company) => {
            const value = company.status === 'ok' ? `${formatNumber(company.invoiceCount)} invoices` : company.error;
            return `${escapeHtml(company.name)}: ${escapeHtml(value)}`;
          })
          .join(' · ');
        $('coverageLine').innerHTML = `<span class="coverage-label">${label}</span><span>${details}</span>`;
      }

      let allInvoices = [];
      let activeStatus = 'all';

      function initialStatusFromURL() {
        const requested = new URLSearchParams(window.location.search).get('status');
        return TAB_IDS[requested] ? requested : 'all';
      }

      function setActiveTab(status) {
        activeStatus = status;
        Object.entries(TAB_IDS).forEach(([key, id]) => {
          $(id).classList.toggle('active', key === status);
          $(id).setAttribute('aria-pressed', String(key === status));
        });
      }

      function sortByOutstandingDesc(invoices) {
        return [...invoices].sort((a, b) => (b.outstandingAmount || 0) - (a.outstandingAmount || 0));
      }

      function shortCompany(name) {
        const value = String(name ?? '') || 'Unknown company';
        if (/sdn/i.test(value)) return 'Sdn Bhd';
        if (/^wanson enterprise$/i.test(value.trim())) return 'Enterprise';
        return value;
      }

      function buildInvoiceRow(invoice) {
        const meta = PAYMENT_STATUS_META[invoice.paymentStatus] || PAYMENT_STATUS_META.unknown;
        const company = invoice.companyName || 'Unknown company';
        return `
        <div class="inv-row row-line">
          <div class="inv-name c-ink">${escapeHtml(invoice.customerName || 'Unknown customer')}</div>
          <div class="inv-meta">
            <span class="inv-company${/sdn/i.test(company) ? ' is-sdn' : ''}" title="${escapeHtml(company)}">${escapeHtml(shortCompany(company))}</span><span class="inv-sep"> · </span><span class="inv-doc">${escapeHtml(invoice.docNo)}</span>
          </div>
          <div class="inv-total c-ink">${formatMYR(invoice.grandTotal)}</div>
          <span class="inv-status ${meta.badgeClass}">${meta.label}</span>
        </div>`;
      }

      function renderSummary(filtered) {
        const total = filtered.reduce((sum, inv) => sum + (inv.grandTotal || 0), 0);
        const label = activeStatus === 'all' ? 'invoices today' : `${activeStatus} today`;
        $('summaryLine').textContent = `${filtered.length} ${label} · ${formatMYR(total)}`;
      }

      function renderList() {
        const filtered =
          activeStatus === 'all' ? allInvoices : allInvoices.filter((inv) => inv.paymentStatus === activeStatus);

        renderSummary(filtered);

        const listEl = $('invoiceList');
        if (filtered.length === 0) {
          listEl.innerHTML = '<div class="c-muted text-sm px-3 py-6 text-center">No invoices in this view</div>';
        } else {
          listEl.innerHTML = sortByOutstandingDesc(filtered).map(buildInvoiceRow).join('');
        }

        $('listSkeleton').classList.add('hidden');
        $('invoiceHead').classList.toggle('hidden', filtered.length === 0);
        listEl.classList.remove('hidden');
      }

      async function fetchTodayInvoices() {
        try {
          const res = await fetch('/api/sales', { cache: 'no-store' });
          const data = await res.json().catch(() => ({}));
          if (!res.ok || !data.success) {
            const error = new Error(data.error || `Request failed with status ${res.status}`);
            error.responseData = data;
            throw error;
          }

          allInvoices = data.invoices || [];
          renderCoverage(data);
          renderList();
        } catch (error) {
          console.error('Today invoices fetch error:', error);
          $('summaryLine').textContent = 'Failed to load invoices';
          renderCoverage(error.responseData || { error: error.message });
        }
      }

      function bindEvents() {
        Object.values(TAB_IDS).forEach((id) => {
          $(id).addEventListener('click', () => {
            setActiveTab($(id).dataset.status);
            renderList();
          });
        });
      }

      window.addEventListener('load', () => {
        setActiveTab(initialStatusFromURL());
        bindEvents();
        fetchTodayInvoices();
      });
    </script>
  </body>
</html>
