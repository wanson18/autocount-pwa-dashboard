<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#3b82f6" />
    <title>Today's Invoices — Wanson Companies</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
      }

      .skeleton {
        background: linear-gradient(90deg, #1e293b 25%, #334155 50%, #1e293b 75%);
        background-size: 200% 100%;
        animation: shimmer 1.5s infinite;
      }
      @keyframes shimmer {
        0% {
          background-position: -200% 0;
        }
        100% {
          background-position: 200% 0;
        }
      }

      .panel {
        background-color: #1e293b; /* slate-800 */
        border: 1px solid #334155; /* slate-700 */
        border-radius: 0.75rem;
      }

      .tab-btn {
        font-size: 0.75rem;
        padding: 0.375rem 0.75rem;
        border-radius: 0.5rem;
        font-weight: 500;
        background-color: #334155; /* slate-700 */
        color: #cbd5e1; /* slate-300 */
        transition: background-color 0.15s ease;
      }
      .tab-btn:hover {
        background-color: #475569; /* slate-600 */
      }
      .tab-btn.active {
        background-color: #2563eb; /* blue-600 */
        color: #ffffff;
      }
    </style>
  </head>
  <body class="bg-slate-900 text-white min-h-screen">
    <div class="max-w-md mx-auto px-4 pb-8">
      <!-- ===== Header ===== -->
      <header class="py-4 flex items-center gap-2 border-b border-slate-700">
        <a href="/" aria-label="Back to dashboard" class="p-2 -ml-2 rounded-lg hover:bg-slate-800 transition">
          <svg class="w-5 h-5 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
          </svg>
        </a>
        <h1 class="text-lg font-bold">Wanson Companies · Today's Invoices</h1>
      </header>

      <!-- ===== Status tabs ===== -->
      <div class="flex gap-1.5 mt-4">
        <button type="button" id="tabAll" class="tab-btn" data-status="all">All</button>
        <button type="button" id="tabPaid" class="tab-btn" data-status="paid">Paid</button>
        <button type="button" id="tabPartial" class="tab-btn" data-status="partial">Partial</button>
        <button type="button" id="tabUnpaid" class="tab-btn" data-status="unpaid">Unpaid</button>
      </div>

      <div id="summaryLine" class="text-xs text-slate-400 mt-3 mb-2">Loading…</div>
      <div id="coverageLine" class="text-[10px] text-slate-400 mb-2" aria-live="polite">Loading both company books…</div>

      <div class="panel overflow-hidden">
        <div id="listSkeleton" class="p-4 space-y-2">
          <div class="skeleton h-4 rounded w-full"></div>
          <div class="skeleton h-4 rounded w-3/4"></div>
          <div class="skeleton h-4 rounded w-5/6"></div>
        </div>
        <div id="invoiceList" class="hidden divide-y divide-slate-700"></div>
      </div>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);

      const PAYMENT_STATUS_META = {
        paid: { label: 'Paid', badgeClass: 'bg-emerald-500/20 text-emerald-400' },
        partial: { label: 'Partial', badgeClass: 'bg-amber-500/20 text-amber-400' },
        unpaid: { label: 'Unpaid', badgeClass: 'bg-red-500/20 text-red-400' },
        unknown: { label: 'Unknown', badgeClass: 'bg-slate-500/20 text-slate-400' },
      };

      const TAB_IDS = { all: 'tabAll', paid: 'tabPaid', partial: 'tabPartial', unpaid: 'tabUnpaid' };

      const HTML_ESCAPES = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
      function escapeHtml(str) {
        return String(str ?? '').replace(/[&<>"']/g, (c) => HTML_ESCAPES[c]);
      }

      function formatMYR(value) {
        return `RM ${Number(value || 0).toLocaleString('en-MY', { minimumFractionDigits: 2 })}`;
      }

      function formatNumber(value) {
        return Number(value || 0).toLocaleString();
      }

      function renderCoverage(data) {
        const companies = Array.isArray(data?.companies) ? data.companies : [];
        if (companies.length === 0) {
          $('coverageLine').className = 'text-[10px] text-red-400 mb-2';
          $('coverageLine').textContent = data?.error || 'Both company books are unavailable';
          return;
        }

        const allUnavailable = companies.every((company) => company.status !== 'ok');
        $('coverageLine').className = `${data.complete ? 'text-slate-400' : 'text-red-400'} text-[10px] mb-2`;
        const label = data.complete
          ? 'Both books loaded'
          : allUnavailable
            ? 'NO DATA — both books unavailable'
            : 'PARTIAL DATA — check the unavailable book';
        const details = companies
          .map((company) => {
            const value = company.status === 'ok' ? `${formatNumber(company.invoiceCount)} invoices` : company.error;
            return `${escapeHtml(company.name)}: ${escapeHtml(value)}`;
          })
          .join(' · ');
        $('coverageLine').innerHTML = `<span class="font-semibold">${label}</span> · ${details}`;
      }

      let allInvoices = [];
      let activeStatus = 'all';

      function initialStatusFromURL() {
        const requested = new URLSearchParams(window.location.search).get('status');
        return TAB_IDS[requested] ? requested : 'all';
      }

      function setActiveTab(status) {
        activeStatus = status;
        Object.entries(TAB_IDS).forEach(([key, id]) => {
          $(id).classList.toggle('active', key === status);
        });
      }

      function sortByOutstandingDesc(invoices) {
        return [...invoices].sort((a, b) => (b.outstandingAmount || 0) - (a.outstandingAmount || 0));
      }

      function buildInvoiceRow(invoice) {
        const meta = PAYMENT_STATUS_META[invoice.paymentStatus] || PAYMENT_STATUS_META.unknown;
        return `
        <div class="flex items-center justify-between px-3 py-2.5 text-xs">
          <div class="min-w-0">
            <div class="text-white truncate">${escapeHtml(invoice.customerName || 'Unknown customer')}</div>
            <div class="text-slate-500 text-[10px]">${escapeHtml(invoice.companyName || 'Unknown company')} · ${escapeHtml(invoice.docNo)}</div>
          </div>
          <div class="flex items-center gap-2 shrink-0">
            <span class="text-slate-300">${formatMYR(invoice.grandTotal)}</span>
            <span class="${meta.badgeClass} px-1.5 py-0.5 rounded text-[10px] font-medium">${meta.label}</span>
          </div>
        </div>`;
      }

      function renderSummary(filtered) {
        const total = filtered.reduce((sum, inv) => sum + (inv.grandTotal || 0), 0);
        const label = activeStatus === 'all' ? 'invoices today' : `${activeStatus} today`;
        $('summaryLine').textContent = `${filtered.length} ${label} · ${formatMYR(total)}`;
      }

      function renderList() {
        const filtered =
          activeStatus === 'all' ? allInvoices : allInvoices.filter((inv) => inv.paymentStatus === activeStatus);

        renderSummary(filtered);

        const listEl = $('invoiceList');
        if (filtered.length === 0) {
          listEl.innerHTML = '<div class="text-slate-500 text-xs px-3 py-4 text-center">No invoices in this view</div>';
        } else {
          listEl.innerHTML = sortByOutstandingDesc(filtered).map(buildInvoiceRow).join('');
        }

        $('listSkeleton').classList.add('hidden');
        listEl.classList.remove('hidden');
      }

      async function fetchTodayInvoices() {
        try {
          const res = await fetch('/api/sales', { cache: 'no-store' });
          const data = await res.json().catch(() => ({}));
          if (!res.ok || !data.success) {
            const error = new Error(data.error || `Request failed with status ${res.status}`);
            error.responseData = data;
            throw error;
          }

          allInvoices = data.invoices || [];
          renderCoverage(data);
          renderList();
        } catch (error) {
          console.error('Today invoices fetch error:', error);
          $('summaryLine').textContent = 'Failed to load invoices';
          renderCoverage(error.responseData || { error: error.message });
        }
      }

      function bindEvents() {
        Object.values(TAB_IDS).forEach((id) => {
          $(id).addEventListener('click', () => {
            setActiveTab($(id).dataset.status);
            renderList();
          });
        });
      }

      window.addEventListener('load', () => {
        setActiveTab(initialStatusFromURL());
        bindEvents();
        fetchTodayInvoices();
      });
    </script>
  </body>
</html>
