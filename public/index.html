<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#3b82f6">
  <title>AutoCount Sales Dashboard</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
    .skeleton { background: linear-gradient(90deg, #1e293b 25%, #334155 50%, #1e293b 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; }
    @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; }
    .status-online { background-color: #22c55e; }
    .status-offline { background-color: #ef4444; }
    .card-glow { box-shadow: 0 0 20px rgba(59, 130, 246, 0.15); }
    input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.7); }
  </style>
</head>
<body class="bg-slate-900 text-white min-h-screen">
  <div class="max-w-md mx-auto px-4 pb-8">
    <header class="py-4 flex items-center justify-between border-b border-slate-700">
      <div class="flex items-center gap-2">
        <svg class="w-6 h-6 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
        </svg>
        <h1 class="text-lg font-bold">Sales Dashboard</h1>
      </div>
      <div class="flex items-center gap-3">
        <div id="statusIndicator" class="flex items-center gap-1 text-xs text-slate-400">
          <div id="statusDot" class="status-dot status-online"></div>
          <span id="statusText">Online</span>
        </div>
        <button id="refreshBtn" onclick="fetchData(currentStartDate, currentEndDate)" class="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
          </svg>
        </button>
      </div>
    </header>

    <div id="lastUpdated" class="text-xs text-slate-500 mt-2 text-right">Last updated: --</div>

    <div class="mt-4 bg-slate-800 rounded-xl p-3 border border-slate-700">
      <div class="flex items-center gap-2 mb-2">
        <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
        </svg>
        <span class="text-xs font-semibold text-slate-300">Date Range</span>
      </div>
      <div class="flex gap-1.5 mb-2">
        <button onclick="setPreset('today')" id="btnToday" class="preset-btn active text-xs px-3 py-1.5 rounded-lg bg-blue-600 text-white font-medium transition">Today</button>
        <button onclick="setPreset('yesterday')" id="btnYesterday" class="preset-btn text-xs px-3 py-1.5 rounded-lg bg-slate-700 text-slate-300 hover:bg-slate-600 transition">Yesterday</button>
        <button onclick="setPreset('7days')" id="btn7days" class="preset-btn text-xs px-3 py-1.5 rounded-lg bg-slate-700 text-slate-300 hover:bg-slate-600 transition">7 Days</button>
        <button onclick="setPreset('30days')" id="btn30days" class="preset-btn text-xs px-3 py-1.5 rounded-lg bg-slate-700 text-slate-300 hover:bg-slate-600 transition">30 Days</button>
        <button onclick="setPreset('month')" id="btnMonth" class="preset-btn text-xs px-3 py-1.5 rounded-lg bg-slate-700 text-slate-300 hover:bg-slate-600 transition">This Month</button>
      </div>
      <div class="flex items-center gap-2">
        <input type="date" id="startDate" class="flex-1 px-2 py-1.5 bg-slate-900 border border-slate-600 rounded-lg text-xs text-white focus:outline-none focus:border-blue-500">
        <span class="text-slate-500 text-xs">to</span>
        <input type="date" id="endDate" class="flex-1 px-2 py-1.5 bg-slate-900 border border-slate-600 rounded-lg text-xs text-white focus:outline-none focus:border-blue-500">
        <button onclick="applyCustomDate()" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-medium rounded-lg transition">Go</button>
      </div>
    </div>

    <section id="kpiGrid" class="grid grid-cols-2 gap-3 mt-4">
      <div id="kpiRevenue" class="card-glow bg-slate-800 rounded-xl p-4 border border-slate-700">
        <div class="text-slate-400 text-xs">Total Revenue</div>
        <div id="kpiRevenueValue" class="text-xl font-bold text-emerald-400 mt-1">--</div>
      </div>
      <div id="kpiInvoices" class="card-glow bg-slate-800 rounded-xl p-4 border border-slate-700">
        <div class="text-slate-400 text-xs">Invoices</div>
        <div id="kpiInvoicesValue" class="text-xl font-bold text-blue-400 mt-1">--</div>
      </div>
      <div id="kpiUnits" class="card-glow bg-slate-800 rounded-xl p-4 border border-slate-700">
        <div class="text-slate-400 text-xs">Units Sold</div>
        <div id="kpiUnitsValue" class="text-xl font-bold text-purple-400 mt-1">--</div>
      </div>
      <div id="kpiCustomer" class="card-glow bg-slate-800 rounded-xl p-4 border border-slate-700">
        <div class="text-slate-400 text-xs">Top Customer</div>
        <div id="kpiCustomerValue" class="text-sm font-bold text-amber-400 mt-1 truncate">--</div>
      </div>
    </section>

    <section class="mt-6">
      <h2 class="text-sm font-semibold text-slate-300 mb-2">Top 5 Products by Revenue</h2>
      <div class="bg-slate-800 rounded-xl p-4 border border-slate-700">
        <canvas id="barChart" height="160"></canvas>
      </div>
    </section>

    <section class="mt-6">
      <h2 class="text-sm font-semibold text-slate-300 mb-2">Units by SKU</h2>
      <div class="bg-slate-800 rounded-xl p-4 border border-slate-700 flex justify-center">
        <canvas id="doughnutChart" height="200" width="200"></canvas>
      </div>
    </section>

    <section class="mt-6">
      <h2 class="text-sm font-semibold text-slate-300 mb-2">Product Breakdown</h2>
      <input id="searchInput" type="text" placeholder="Search product name or SKU..." class="w-full px-3 py-2 mb-3 bg-slate-800 border border-slate-700 rounded-lg text-sm focus:outline-none focus:border-blue-500" oninput="filterTable()">
      <div class="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden">
        <div id="tableSkeleton" class="p-4 space-y-2">
          <div class="skeleton h-4 rounded w-full"></div>
          <div class="skeleton h-4 rounded w-3/4"></div>
          <div class="skeleton h-4 rounded w-5/6"></div>
        </div>
        <table id="skuTable" class="w-full text-sm hidden">
          <thead class="bg-slate-900">
            <tr>
              <th class="px-3 py-2 text-left text-xs text-slate-400">Product</th>
              <th class="px-3 py-2 text-right text-xs text-slate-400">Units</th>
              <th class="px-3 py-2 text-right text-xs text-slate-400">Revenue</th>
            </tr>
          </thead>
          <tbody id="skuTableBody" class="divide-y divide-slate-700"></tbody>
        </table>
      </div>
    </section>
  </div>

  <script>
    let barChart, doughnutChart, allSKUData = [];
    let currentStartDate = '', currentEndDate = '';

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('SW registered'))
          .catch(err => console.warn('SW registration skipped:', err));
      });
    }

    function getToday() { return new Date().toISOString().slice(0, 10); }
    function getYesterday() { const d = new Date(); d.setDate(d.getDate() - 1); return d.toISOString().slice(0, 10); }
    function getDaysAgo(n) { const d = new Date(); d.setDate(d.getDate() - n); return d.toISOString().slice(0, 10); }
    function getMonthStart() { const d = new Date(); d.setDate(1); return d.toISOString().slice(0, 10); }

    function setActivePreset(id) {
      document.querySelectorAll('.preset-btn').forEach(b => {
        b.classList.remove('active', 'bg-blue-600', 'text-white');
        b.classList.add('bg-slate-700', 'text-slate-300');
      });
      const btn = document.getElementById(id);
      if (btn) {
        btn.classList.add('active', 'bg-blue-600', 'text-white');
        btn.classList.remove('bg-slate-700', 'text-slate-300');
      }
    }

    function setPreset(preset) {
      const today = getToday();
      let start, end, btnId;

      switch (preset) {
        case 'today':
          start = end = today; btnId = 'btnToday'; break;
        case 'yesterday':
          start = end = getYesterday(); btnId = 'btnYesterday'; break;
        case '7days':
          start = getDaysAgo(6); end = today; btnId = 'btn7days'; break;
        case '30days':
          start = getDaysAgo(29); end = today; btnId = 'btn30days'; break;
        case 'month':
          start = getMonthStart(); end = today; btnId = 'btnMonth'; break;
        default:
          start = end = today; btnId = 'btnToday';
      }

      setActivePreset(btnId);
      document.getElementById('startDate').value = start;
      document.getElementById('endDate').value = end;
      currentStartDate = start;
      currentEndDate = end;
      fetchData(start, end);
    }

    function applyCustomDate() {
      const start = document.getElementById('startDate').value;
      const end = document.getElementById('endDate').value;
      if (!start || !end) return;
      setActivePreset('');
      currentStartDate = start;
      currentEndDate = end;
      fetchData(start, end);
    }

    function updateOnlineStatus() {
      const dot = document.getElementById('statusDot');
      const text = document.getElementById('statusText');
      if (navigator.onLine) {
        dot.classList.remove('status-offline');
        dot.classList.add('status-online');
        text.textContent = 'Online';
      } else {
        dot.classList.remove('status-online');
        dot.classList.add('status-offline');
        text.textContent = 'Offline';
      }
    }

    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);
    updateOnlineStatus();

    async function fetchData(startDate, endDate) {
      const btn = document.getElementById('refreshBtn');
      btn.classList.add('animate-spin');
      try {
        const today = getToday();
        const s = startDate || today;
        const e = endDate || today;
        const res = await fetch(`/api/sales?startDate=${s}&endDate=${e}`);
        const data = await res.json();
        if (data.success) renderDashboard(data);
      } catch (e) {
        console.error('Fetch error:', e);
      } finally {
        btn.classList.remove('animate-spin');
        document.getElementById('lastUpdated').textContent = 'Last updated: ' + new Date().toLocaleTimeString();
      }
    }

    function renderDashboard(data) {
      const dr = data.dateRange;
      if (dr) {
        const label = dr.startDate === dr.endDate ? dr.startDate : `${dr.startDate} to ${dr.endDate}`;
        document.getElementById('lastUpdated').textContent = `Viewing: ${label} | Updated: ${new Date().toLocaleTimeString()}`;
      }

      document.getElementById('kpiRevenueValue').textContent = 'RM ' + data.kpis.totalRevenue.toLocaleString('en-MY', {minimumFractionDigits: 2});
      document.getElementById('kpiInvoicesValue').textContent = data.kpis.totalInvoices;
      document.getElementById('kpiUnitsValue').textContent = data.kpis.totalItemsSold.toLocaleString();
      document.getElementById('kpiCustomerValue').textContent = data.kpis.topCustomer ? data.kpis.topCustomer.name : '--';

      renderBarChart(data.topSKUs);
      renderDoughnutChart(data.skuBreakdown);
      renderTable(data.skuBreakdown);
    }

    function renderBarChart(skus) {
      const ctx = document.getElementById('barChart').getContext('2d');
      if (barChart) barChart.destroy();
      barChart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: skus.map(s => s.description ? s.description.substring(0, 25) : s.sku),
          datasets: [{
            label: 'Revenue (RM)',
            data: skus.map(s => s.totalRevenue),
            backgroundColor: ['#3b82f6', '#22c55e', '#f59e0b', '#ef4444', '#8b5cf6'],
            borderRadius: 6
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                title: (items) => skus[items[0].dataIndex].description || skus[items[0].dataIndex].sku,
                label: (item) => `RM ${item.raw.toLocaleString('en-MY', {minimumFractionDigits: 2})}`
              }
            }
          },
          scales: {
            y: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } },
            x: { ticks: { color: '#94a3b8', font: { size: 10 }, maxRotation: 45 }, grid: { display: false } }
          }
        }
      });
    }

    function renderDoughnutChart(skus) {
      const ctx = document.getElementById('doughnutChart').getContext('2d');
      if (doughnutChart) doughnutChart.destroy();
      const colors = ['#3b82f6', '#22c55e', '#f59e0b', '#ef4444', '#8b5cf6', '#06b6d4', '#ec4899'];
      doughnutChart = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: skus.map(s => s.description ? s.description.substring(0, 20) : s.sku),
          datasets: [{
            data: skus.map(s => s.totalUnits),
            backgroundColor: colors.slice(0, skus.length),
            borderWidth: 0
          }]
        },
        options: {
          responsive: false,
          plugins: {
            legend: { position: 'bottom', labels: { color: '#94a3b8', font: { size: 10 } } },
            tooltip: {
              callbacks: {
                title: (items) => skus[items[0].dataIndex].description || skus[items[0].dataIndex].sku,
                label: (item) => `${item.raw.toLocaleString()} units`
              }
            }
          }
        }
      });
    }

    function renderTable(skus) {
      allSKUData = skus;
      const tbody = document.getElementById('skuTableBody');
      tbody.innerHTML = skus.map(s => `
        <tr class="hover:bg-slate-750">
          <td class="px-3 py-2 text-xs">
            <div class="text-white font-medium">${s.description || s.sku}</div>
            <div class="text-slate-500 text-[10px] mt-0.5">${s.sku}</div>
          </td>
          <td class="px-3 py-2 text-right">${s.totalUnits.toLocaleString()}</td>
          <td class="px-3 py-2 text-right text-emerald-400">RM ${s.totalRevenue.toLocaleString('en-MY', {minimumFractionDigits: 2})}</td>
        </tr>
      `).join('');
      document.getElementById('tableSkeleton').classList.add('hidden');
      document.getElementById('skuTable').classList.remove('hidden');
    }

    function filterTable() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = allSKUData.filter(s => (s.description || '').toLowerCase().includes(query) || s.sku.toLowerCase().includes(query));
      const tbody = document.getElementById('skuTableBody');
      tbody.innerHTML = filtered.map(s => `
        <tr class="hover:bg-slate-750">
          <td class="px-3 py-2 text-xs">
            <div class="text-white font-medium">${s.description || s.sku}</div>
            <div class="text-slate-500 text-[10px] mt-0.5">${s.sku}</div>
          </td>
          <td class="px-3 py-2 text-right">${s.totalUnits.toLocaleString()}</td>
          <td class="px-3 py-2 text-right text-emerald-400">RM ${s.totalRevenue.toLocaleString('en-MY', {minimumFractionDigits: 2})}</td>
        </tr>
      `).join('');
    }

    window.addEventListener('load', () => setPreset('today'));
  </script>
</body>
</html>
